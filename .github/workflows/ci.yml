name: CI

on:
  push:
    branches: [master, 'feat/**', 'fix/**', 'chore/**', 'test/**', 'docs/**', 'refactor/**', 'ci/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Unit tests and lint
        run: ./gradlew :core:common:test :core:model:test :core:domain:test :core:network:test :core:domain:jacocoVerify --stacktrace
